name: Build Android game

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'assets/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'buildozer.spec'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up test Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Test desktop and shared game logic
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          APPLIN_TEST_MODE: '1'
        run: python -m unittest discover -s tests -v

  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Android build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Restore Android build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec', '.github/workflows/android-build.yml') }}

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-virtualenv \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

          python -m pip install "pip==23.0.1"
          python -m pip install buildozer setuptools cython==0.29.34

      - name: Remove stale Android packaging environment
        run: |
          if [ -d .buildozer/android/platform ]; then
            find .buildozer/android/platform \
              -type d \
              -path '*/build/venv' \
              -prune \
              -exec rm -rf -- {} +
          fi

      - name: Build debug APK
        run: |
          printf '%s\n' 'pip==23.0.1' > "$RUNNER_TEMP/android-pip-constraints.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/android-pip-constraints.txt" buildozer -v android debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ApplinEscape-Android-Debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
