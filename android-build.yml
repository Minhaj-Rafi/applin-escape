name: Build Android game

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'assets/**'
      - 'buildozer.spec'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test desktop and shared game logic
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          APPLIN_TEST_MODE: '1'
        run: python -m unittest discover -s tests -v

  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Python version used by the Android pygame recipe.
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-virtualenv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools cython==0.29.34
      - name: Build debug APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: ApplinEscape-Android-Debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
